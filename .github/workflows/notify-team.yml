name: Notify Team Workflow

on:
  push:
    branches:
      - main
    paths:
      - "content/**"
  workflow_dispatch:
    inputs:
      type:
        description: "Loại báo cáo cần thông báo (latest, daily, weekly, deep-dive)"
        required: false
        default: "latest"
      channel:
        description: "Kênh gửi (all, teams, telegram, slack, discord)"
        required: false
        default: "all"

jobs:
  notify:
    name: Dispatch Intelligence Summary to Team
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Notification Workflow
        env:
          SITE_URL: "https://daily-research.vercel.app"
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            node scripts/notify-team.mjs --type "${{ github.event.inputs.type }}" --channel "${{ github.event.inputs.channel }}"
          else
            node scripts/notify-team.mjs --type latest --channel all
          fi
